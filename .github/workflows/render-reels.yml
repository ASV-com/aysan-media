# Rendert reels: push een spec naar reels/<naam>.json -> posts/<naam>.mp4 + .jpg (cover)
name: render-reels
on:
  push:
    branches: [main]
    paths: ['reels/*.json', 'tools/make_reel.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: render-reels
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installeren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-liberation
          pip install -q pillow
      - name: Renderen (alleen specs zonder mp4)
        run: |
          set -e
          for spec in reels/*.json; do
            [ -e "$spec" ] || continue
            name=$(basename "$spec" .json)
            if [ ! -f "posts/$name.mp4" ]; then
              python3 tools/make_reel.py "$spec" "posts/$name.mp4"
            fi
          done
      - name: Committen
        run: |
          git config user.name "aysan-media-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posts/*.mp4 posts/*.jpg 2>/dev/null || true
          if git diff --cached --quiet; then echo "niets nieuw"; exit 0; fi
          git commit -m "Reels gerenderd"
          git pull --rebase origin main
          git push origin HEAD:main
